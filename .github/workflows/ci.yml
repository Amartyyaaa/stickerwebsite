name: CI

# Every push: lint, type check, unit tests and a production build.
# Pull requests (and "Run workflow" on the Actions tab) also run the browser tests,
# which take about 3 minutes of the free monthly Actions allowance.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build reads the catalog from the database, so it gets a fresh one with the demo products.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0123456789
        run: |
          npm run db:migrate
          npm run db:seed -- sample
          npm run build

  browser-tests:
    name: Browser tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts its own copy of the store (fresh database, test settings) on port 3200; see e2e/env.ts.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
